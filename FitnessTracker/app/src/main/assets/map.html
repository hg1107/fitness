<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Activity Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Leaflet CSS/JS (For fallback or primary OSM map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

    <!-- Mapbox GL JS CSS/JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js" defer></script>

    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #ffffff; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; }
        .leaflet-container { background: #121212; }
        .leaflet-bar { border: none !important; }
        .leaflet-bar a { background-color: #1C1C1E !important; color: #ffffff !important; border-bottom: 1.5px solid #2C2C2E !important; }
        .leaflet-bar a:hover { background-color: #2C2C2E !important; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    var map;
    var leafletMap = null;
    var mapboxMap = null;
    var routeLayer = null;
    var startMarker = null;
    var endMarker = null;
    var currentMarker = null;
    var isMapboxEnabled = false;

    function initMap(mapboxToken, initialLat, initialLon) {
        console.log("initMap called with token: " + mapboxToken + ", lat: " + initialLat + ", lon: " + initialLon);
        var lat = initialLat || 0.0;
        var lon = initialLon || 0.0;
        var zoom = (lat === 0.0 && lon === 0.0) ? 2 : 15;

        // Reset previous maps if any
        if (leafletMap) {
            leafletMap.remove();
            leafletMap = null;
        }
        if (mapboxMap) {
            mapboxMap.remove();
            mapboxMap = null;
        }
        document.getElementById('map').innerHTML = "";

        // Try Mapbox if token is provided, otherwise fallback to Leaflet
        if (mapboxToken && mapboxToken.trim() !== "" && mapboxToken.indexOf("YOUR_") !== 0) {
            try {
                mapboxgl.accessToken = mapboxToken;
                mapboxMap = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/dark-v11',
                    center: [lon, lat],
                    zoom: zoom
                });

                mapboxMap.on('load', function () {
                    isMapboxEnabled = true;
                    // Add route source and layer
                    mapboxMap.addSource('route', {
                        'type': 'geojson',
                        'data': {
                            'type': 'Feature',
                            'properties': {},
                            'geometry': {
                                'type': 'LineString',
                                'coordinates': []
                            }
                        }
                    });

                    mapboxMap.addLayer({
                        'id': 'route',
                        'type': 'line',
                        'source': 'route',
                        'layout': {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        'paint': {
                            'line-color': '#fc4c02', // Strava Orange!
                            'line-width': 5
                        }
                    });
                });
                return;
            } catch (e) {
                console.error("Mapbox init failed, falling back to Leaflet OSM", e);
            }
        }

        // Leaflet Fallback (OpenStreetMap)
        isMapboxEnabled = false;
        leafletMap = L.map('map', { zoomControl: false }).setView([lat, lon], zoom);
        
        // Use a nice dark tile style from CartoDB Dark Matter
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CartoDB',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(leafletMap);
        
        L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);
    }

    function updateCurrentLocation(lat, lon) {
        if (lat === 0.0 && lon === 0.0) return;

        if (isMapboxEnabled && mapboxMap) {
            mapboxMap.easeTo({ center: [lon, lat], zoom: 15 });
            
            // Create or update current location marker
            if (!currentMarker) {
                var el = document.createElement('div');
                el.style.width = '12px';
                el.style.height = '12px';
                el.style.backgroundColor = '#FC4C02'; // Strava Orange
                el.style.borderRadius = '50%';
                el.style.border = '2px solid #ffffff';
                el.style.boxShadow = '0 0 8px #FC4C02';
                currentMarker = new mapboxgl.Marker(el)
                    .setLngLat([lon, lat])
                    .addTo(mapboxMap);
            } else {
                currentMarker.setLngLat([lon, lat]);
            }
        } else if (leafletMap) {
            leafletMap.setView([lat, lon], 15);
            
            if (!currentMarker) {
                var orangeDotIcon = L.divIcon({
                    html: '<div style="width:12px;height:12px;background-color:#FC4C02;border-radius:50%;border:2px solid #ffffff;box-shadow:0 0 8px #FC4C02;"></div>',
                    className: '',
                    iconSize: [12, 12]
                });
                currentMarker = L.marker([lat, lon], { icon: orangeDotIcon }).addTo(leafletMap);
            } else {
                currentMarker.setLatLng([lat, lon]);
            }
        }
    }

    function setRoute(pointsJson) {
        console.log("setRoute called with: " + pointsJson);
        var points = JSON.parse(pointsJson); // Array of {latitude, longitude} or [lat, lon]
        if (!points || points.length === 0) return;

        // Normalize points format
        var normalizedPoints = points.map(function(p) {
            if (p.latitude !== undefined && p.longitude !== undefined) {
                return [p.latitude, p.longitude];
            } else if (Array.isArray(p)) {
                return p;
            }
            return null;
        }).filter(Boolean);

        if (normalizedPoints.length === 0) return;

        if (isMapboxEnabled && mapboxMap) {
            var coords = normalizedPoints.map(function(p) { return [p[1], p[0]]; }); // Mapbox expects [lon, lat]
            
            if (mapboxMap.getSource('route')) {
                mapboxMap.getSource('route').setData({
                    'type': 'Feature',
                    'properties': {},
                    'geometry': {
                        'type': 'LineString',
                        'coordinates': coords
                    }
                });

                // Adjust bounds
                if (coords.length > 1) {
                    var bounds = coords.reduce(function (acc, coord) {
                        return acc.extend(coord);
                    }, new mapboxgl.LngLatBounds(coords[0], coords[0]));
                    mapboxMap.fitBounds(bounds, { padding: 40 });
                }
            }

            // Draw start and end markers
            drawStartEndMarkersMapbox(coords[0], coords[coords.length - 1]);
        } else if (leafletMap) {
            if (routeLayer) {
                leafletMap.removeLayer(routeLayer);
            }
            
            routeLayer = L.polyline(normalizedPoints, { color: '#FC4C02', weight: 5 }).addTo(leafletMap);
            
            if (normalizedPoints.length > 1) {
                leafletMap.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
            }

            drawStartEndMarkersLeaflet(normalizedPoints[0], normalizedPoints[normalizedPoints.length - 1]);
        }
    }

    function drawStartEndMarkersMapbox(startCoords, endCoords) {
        if (startMarker) startMarker.remove();
        if (endMarker) endMarker.remove();

        var startEl = document.createElement('div');
        startEl.style.width = '10px';
        startEl.style.height = '10px';
        startEl.style.backgroundColor = '#2ecc71'; // Green
        startEl.style.borderRadius = '50%';
        startEl.style.border = '2px solid #ffffff';
        startMarker = new mapboxgl.Marker(startEl).setLngLat(startCoords).addTo(mapboxMap);

        var endEl = document.createElement('div');
        endEl.style.width = '10px';
        endEl.style.height = '10px';
        endEl.style.backgroundColor = '#e74c3c'; // Red
        endEl.style.borderRadius = '50%';
        endEl.style.border = '2px solid #ffffff';
        endMarker = new mapboxgl.Marker(endEl).setLngLat(endCoords).addTo(mapboxMap);
    }

    function drawStartEndMarkersLeaflet(startLatLng, endLatLng) {
        if (startMarker) leafletMap.removeLayer(startMarker);
        if (endMarker) leafletMap.removeLayer(endMarker);

        var greenDotIcon = L.divIcon({
            html: '<div style="width:10px;height:10px;background-color:#2ecc71;border-radius:50%;border:2px solid #ffffff;"></div>',
            className: '',
            iconSize: [10, 10]
        });
        startMarker = L.marker(startLatLng, { icon: greenDotIcon }).addTo(leafletMap);

        var redDotIcon = L.divIcon({
            html: '<div style="width:10px;height:10px;background-color:#e74c3c;border-radius:50%;border:2px solid #ffffff;"></div>',
            className: '',
            iconSize: [10, 10]
        });
        endMarker = L.marker(endLatLng, { icon: redDotIcon }).addTo(leafletMap);
    }

    function clearRoute() {
        if (isMapboxEnabled && mapboxMap) {
            if (mapboxMap.getSource('route')) {
                mapboxMap.getSource('route').setData({
                    'type': 'Feature',
                    'properties': {},
                    'geometry': { 'type': 'LineString', 'coordinates': [] }
                });
            }
            if (startMarker) startMarker.remove();
            if (endMarker) endMarker.remove();
            if (currentMarker) currentMarker.remove();
            startMarker = null;
            endMarker = null;
            currentMarker = null;
        } else if (leafletMap) {
            if (routeLayer) leafletMap.removeLayer(routeLayer);
            if (startMarker) leafletMap.removeLayer(startMarker);
            if (endMarker) leafletMap.removeLayer(endMarker);
            if (currentMarker) leafletMap.removeLayer(currentMarker);
            routeLayer = null;
            startMarker = null;
            endMarker = null;
            currentMarker = null;
        }
    }
</script>
</body>
</html>
